name: Windows bridge build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - name: Update Python package installer
      run: python -m pip install --upgrade pip
    - name: Install optional pairing dependencies for tests
      run: python -m pip install -r requirements-pairing.txt
    - name: Run offline bridge and TLS pairing tests
      run: python -m unittest discover -s tests -p "test_*.py" -v
    - name: Compile Windows SSH wrapper
      run: ./scripts/build.ps1
    - name: Package bridge with prebuilt wrapper
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $stage = 'dist/herdr-bridge-win-x64'
        New-Item -ItemType Directory -Force "$stage/build" | Out-Null
        # Only tracked source/documentation and the compiled wrapper enter the ZIP.
        git archive --format=zip --output=source.zip HEAD
        if ($LASTEXITCODE) { throw 'Source archive failed.' }
        Expand-Archive source.zip -DestinationPath $stage
        Copy-Item build/sh-log.exe "$stage/build/sh-log.exe"
        $env:GITHUB_SHA | Set-Content "$stage/BUILD-COMMIT.txt"
        Compress-Archive -Path "$stage/*" -DestinationPath dist/herdr-bridge-win-x64.zip
        "$( (Get-FileHash dist/herdr-bridge-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant() )  herdr-bridge-win-x64.zip" | Set-Content dist/SHA256SUMS.txt
    - uses: actions/github-script@v9
      with:
        script: |
          const publish = require('./.github/scripts/publish-build.cjs');
          await publish({github, context, core, glob, exec});
      env:
        BUILD_NAME: herdr-bridge-win-x64
        BUILD_PATHS: |
          dist/*.zip
          dist/SHA256SUMS.txt
        BUILD_HIDDEN: 'false'
        BUILD_MISSING: error
      if: (success()) && success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    permissions:
      contents: write

